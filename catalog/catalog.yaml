        go: MetrePerSecondSquared
        canonical: true
        doc: the SI unit of acceleration
        symbol: {form: quotient, of: [{form: si, text: m}, {form: si_pow, text: s, power: 2}]}
        source: SI Brochure 9th ed., §2.3.4 Table 3

  - package: density
    doc: Mass density, mass per volume.
    dimension: {length: -3, mass: 1}
