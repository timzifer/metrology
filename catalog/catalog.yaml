        doc: the SI unit of velocity
        symbol: {form: quotient, of: [{form: si, text: m}, {form: si, text: s}]}
        source: SI Brochure 9th ed., §2.3.4 Table 3
      - id: kilometre_per_hour
        go: KilometrePerHour
        doc: a kilometre in an hour
        symbol: {form: static, text: km/h}
        factor: {num: "1", den: "3.6"}
        source: NIST SP 811 (2008), Appendix B.8

  - package: acceleration
    doc: Acceleration, velocity per time.
    dimension: {length: 1, time: -2}
    units:
