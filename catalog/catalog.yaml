        canonical: true
        doc: the SI unit of volume flow rate
        symbol: {form: quotient, of: [{form: si_pow, text: m, power: 3}, {form: si, text: s}]}
        source: SI Brochure 9th ed., §2.3.4 Table 3
      - id: cubic_metre_per_hour
        go: CubicMetrePerHour
        doc: the unit most industrial flow meters are scaled in
        symbol: {form: static, text: "m³/h"}
        factor: {num: "1", den: "3600"}
