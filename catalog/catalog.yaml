        symbol: {form: static, text: P}
        factor: {num: "1", den: "10"}
        source: NIST SP 811 (2008), Appendix B.8

  - package: kinematicviscosity
    doc: |
      Kinematic viscosity: dynamic viscosity over density.

      L²T⁻¹ is also the dimension of thermal diffusivity and of a diffusion
      coefficient. Those are not in the catalogue, because they would print the
      same symbol — m²/s — and the text form of D12 has to read back to one
      unit. See docs/deferred.md.
    dimension: {length: 2, time: -1}
    quantity: kinematic viscosity
    units:
      - id: square_metre_per_second
        go: SquareMetrePerSecond
        canonical: true
        doc: the SI unit of kinematic viscosity
        symbol: {form: quotient, of: [{form: si_pow, text: m, power: 2}, {form: si, text: s}]}
        source: SI Brochure 9th ed., §2.3.4 Table 3
      - id: stokes
        go: Stokes
        doc: the CGS unit of kinematic viscosity
        symbol: {form: static, text: St}
        factor: {num: "1", den: "10000"}
        source: NIST SP 811 (2008), Appendix B.8

  - package: surfacetension
    doc: Surface tension, force per length of contact line.
    dimension: {mass: 1, time: -2}
    units:
      - id: newton_per_metre
        go: NewtonPerMetre
        canonical: true
        doc: the SI unit of surface tension
        symbol: {form: quotient, of: [{form: si, text: N}, {form: si, text: m}]}
        source: SI Brochure 9th ed., §2.3.4 Table 3

  - package: specificheat
