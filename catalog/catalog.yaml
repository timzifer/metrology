      - id: gram_per_litre
        go: GramPerLitre
        doc: a gram in a litre, which is also a kilogram in a cubic metre
        symbol: {form: static, text: g/L}
        source: NIST SP 811 (2008), Appendix B.9

  - package: concentration
    doc: Amount-of-substance concentration.
    dimension: {length: -3, amount_of_substance: 1}
    units:
      - id: mole_per_cubic_metre
        go: MolePerCubicMetre
        canonical: true
        doc: the SI unit of concentration
        symbol: {form: quotient, of: [{form: si, text: mol}, {form: si_pow, text: m, power: 3}]}
        source: SI Brochure 9th ed., §2.3.4 Table 3
      - id: mole_per_litre
        go: MolePerLitre
        doc: the molar, a mole in a litre
        symbol: {form: static, text: mol/L}
        factor: {num: "1000"}
