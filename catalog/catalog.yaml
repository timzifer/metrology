  - package: thermalconductivity
    doc: Thermal conductivity, heat flow per length and temperature difference.
    dimension: {length: 1, mass: 1, time: -3, temperature: -1}
    units:
      - id: watt_per_metre_kelvin
        go: WattPerMetreKelvin
        canonical: true
        doc: the SI unit of thermal conductivity
        symbol:
          form: quotient
          of:
            - {form: si, text: W}
            - {form: product, of: [{form: si, text: m}, {form: si, text: K}]}
        source: SI Brochure 9th ed., §2.3.4 Table 3
