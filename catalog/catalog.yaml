# The unit catalogue.
#
# This file is the source of truth for every unit the library ships (D8). The Go
# code in the quantity packages and in catalog/units_gen.go is generated from it
# by tools/catgen; nothing below is duplicated by hand anywhere.
#
# Every unit carries a source. A conversion factor is a claim about the world,
# and a claim without a citation cannot be checked — which is the whole reason
# the factors are exact fractions (D4): "101325/760" can be compared to the SI
# Brochure character by character, 133.32236842105263 cannot.
#
# Fields
#
#   quantities[].package    the generated Go package name
#   quantities[].dimension  the seven SI exponents, omitted ones are zero
#   units[].id              catalogue-wide identifier, referenced by interval:
#   units[].go              the generated Go identifier
#   units[].canonical       exactly one per dimension and kind
#   units[].symbol          form: static | si | si_pow | gram | litre
#                                 | product | quotient
#   units[].factor          num/den, an exact fraction; both default to 1
#   units[].offset          added before the factor; absolute units only
#   units[].interval        the unit differences on this scale are read on
#
# Conversion to the base unit of the dimension is
#
#     base = (magnitude + offset) · num / den

quantities:
  - package: length
    doc: Length, the SI base quantity of extent.
    dimension: {length: 1}
    units:
      - id: metre
        go: Metre
        canonical: true
        doc: the SI base unit of length
        symbol: {form: si, text: m}
        source: SI Brochure 9th ed., §2.3.1
      - id: kilometre
        go: Kilometre
        doc: a thousand metres
        symbol: {form: static, text: km}
        factor: {num: "1000"}
        source: SI Brochure 9th ed., §3 (SI prefixes)

  - package: area
    doc: Area, length squared.
    dimension: {length: 2}
    units:
      - id: square_metre
        go: SquareMetre
        canonical: true
        doc: the SI unit of area
        symbol: {form: si_pow, text: m, power: 2}
        source: SI Brochure 9th ed., §2.3.4 Table 3

  - package: force
    doc: Force, mass times acceleration.
    dimension: {length: 1, mass: 1, time: -2}
    units:
      - id: newton
        go: Newton
        canonical: true
        doc: the SI unit of force, kg·m·s⁻²
        symbol: {form: si, text: N}
        source: SI Brochure 9th ed., §2.3.4 Table 4

  - package: pressure
    doc: Pressure, force per area.
    dimension: {length: -1, mass: 1, time: -2}
    units:
      - id: pascal
        go: Pascal
        canonical: true
        doc: the SI unit of pressure, N·m⁻²
        symbol: {form: si, text: Pa}
        source: SI Brochure 9th ed., §2.3.4 Table 4
      - id: bar
        go: Bar
        doc: exactly 100 kPa
        symbol: {form: static, text: bar}
        factor: {num: "100000"}
        source: SI Brochure 9th ed., §4.1 Table 8
      - id: torr
        go: Torr
        doc: one 760th of the standard atmosphere
        symbol: {form: static, text: Torr}
        # Exact by definition: the standard atmosphere is 101325 Pa and the
        # torr is one 760th of it. Pre-divided, this factor is 133.322368…,
        # and 760 Torr stops being 101325 Pa (D4).
        factor: {num: "101325", den: "760"}
        source: NIST SP 811 (2008), Appendix B.8

  - package: interval
    doc: |
      Interval units: the scales differences are read on.

      25 °C − 20 °C is 5 K, not 5 °C. The difference between two points on an
      affine scale is a span along it, and a span belongs to a scale with no
      offset (D6). These are the units those spans are expressed in.
    dimension: {temperature: 1}
    units:
      - id: kelvin_interval
        go: Kelvin
        canonical: true
        doc: a temperature difference of one kelvin
        symbol: {form: si, text: K}
        source: SI Brochure 9th ed., §2.3.1
      - id: rankine_interval
        go: Rankine
        doc: a temperature difference of one degree Rankine, five ninths of a kelvin
        symbol: {form: static, text: "°R"}
        factor: {num: "5", den: "9"}
        source: NIST SP 811 (2008), Appendix B.8

  - package: temperature
    doc: |
      Thermodynamic temperature as a point on a scale.

      Every unit here is absolute: 20 °C is a place, not a distance. Adding two
      of them is an error, and subtracting them yields an interval from the
      interval package (D6).
    dimension: {temperature: 1}
    units:
      - id: kelvin
        go: Kelvin
        canonical: true
        kind: absolute
        doc: the SI base unit of thermodynamic temperature
        symbol: {form: si, text: K}
        interval: kelvin_interval
        source: SI Brochure 9th ed., §2.3.1
      - id: celsius
        go: Celsius
        kind: absolute
        doc: the Celsius scale, offset from the kelvin by the ice point
        symbol: {form: static, text: "°C"}
        # t/°C = T/K − 273.15, exactly, by definition of the Celsius scale.
        offset: "273.15"
        interval: kelvin_interval
        source: SI Brochure 9th ed., §2.3.4
      - id: fahrenheit
        go: Fahrenheit
        kind: absolute
        doc: the Fahrenheit scale, five ninths of a kelvin per degree
        symbol: {form: static, text: "°F"}
        # T/K = (t/°F + 459.67) · 5/9. The 5/9 has no finite decimal form,
        # which is why factors are fractions (D4).
        factor: {num: "5", den: "9"}
        offset: "459.67"
        interval: rankine_interval
        source: NIST SP 811 (2008), Appendix B.8
