        symbol: {form: si_pow, text: m, power: 3}
        source: SI Brochure 9th ed., §2.3.4 Table 3
      - id: litre
        go: Litre
        doc: a thousandth of a cubic metre
        symbol: {form: litre}
        factor: {num: "1", den: "1000"}
        source: SI Brochure 9th ed., §4.1 Table 8

  - package: velocity
    doc: Velocity, length per time.
    dimension: {length: 1, time: -1}
    units:
      - id: metre_per_second
        go: MetrePerSecond
