      - id: litre_per_minute
        go: LitrePerMinute
        doc: the unit small flow meters are scaled in
        symbol: {form: static, text: L/min}
        factor: {num: "1", den: "60000"}
        source: NIST SP 811 (2008), Appendix B.9

  - package: massflow
    doc: Mass flow rate.
    dimension: {mass: 1, time: -1}
    units:
      - id: kilogram_per_second
        go: KilogramPerSecond
        canonical: true
        doc: the SI unit of mass flow rate
        symbol: {form: quotient, of: [{form: gram}, {form: si, text: s}]}
        source: SI Brochure 9th ed., §2.3.4 Table 3
      - id: kilogram_per_hour
        go: KilogramPerHour
        doc: mass flow as a plant reads it
        symbol: {form: static, text: kg/h}
        factor: {num: "1", den: "3600"}
