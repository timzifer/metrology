name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build · vet · test · coverage
    runs-on: ubuntu-latest
    # Writes the badge branch on pushes to main; everything else is read-only.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          check-latest: true

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # analysistest loads the corpus under unitvet/testdata with GOPROXY=off,
      # so whatever that module needs has to be in the module cache before the
      # tests start. Building it is also the only thing that checks the corpus
      # still compiles: a testdata directory is invisible to go build ./... .
      - name: Build the unitvet corpus
        run: cd unitvet/testdata && go build ./...

      - name: Test with race detector
        run: go test -race ./...

      # D13: the checker runs against the library's own code, examples and tests,
      # where it must stay silent. The two deliberate mistakes the catalogue
      # tests assert on carry a //unitvet:ignore marker.
      - name: Dimension check (D13)
        run: |
          go build -o "$RUNNER_TEMP/unitvet" ./cmd/unitvet
          go vet -vettool="$RUNNER_TEMP/unitvet" ./...

      # The benchmarks assert nothing and are not a gate: one iteration per case
      # is enough to keep them compiling and running, so that the runtime-cost
      # claims in docs/ and README.md keep a reproduction behind them. CI
      # timings on a shared runner mean nothing and are not recorded.
      - name: Benchmarks compile and run
        run: go test -run '^$' -bench . -benchtime 1x ./...

      # Separate run: -race and -covermode=atomic together are slow and the
      # coverage numbers do not depend on the race detector.
      - name: Coverage profile
        run: go test -covermode=atomic -coverpkg=./... -coverprofile=coverage.out ./...

      - name: Coverage gate (D14)
        run: go run ./tools/covercheck -profile coverage.out -badge coverage-badge.json

      - name: Per-function coverage
        if: always()
        run: go tool cover -func=coverage.out

      - name: Upload coverage profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-profile
          path: coverage.out
          if-no-files-found: ignore

      # The README badge reads this file through the shields.io endpoint API,
      # so the number on the badge is the number covercheck measured — no
      # third-party service ever sees the coverage data. The branch holds
      # nothing but the badge and is rewritten each time, which is why it is an
      # orphan and force-pushed.
      - name: Publish the coverage badge
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test -f coverage-badge.json || exit 0
          work=$(mktemp -d)
          cp coverage-badge.json "$work/coverage.json"
          cd "$work"
          git init -q
          git checkout -q -b badges
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coverage.json
          git commit -q -m "coverage badge for ${GITHUB_SHA}"
          remote="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -q --force "$remote" badges

  generate:
    name: generated code is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          check-latest: true

      # The catalogue is data and the Go code is generated from it (D8); this
      # job is what keeps the committed output in step with the YAML.
      - name: Regenerate
        run: go generate ./...

      - name: Fail if regeneration changed anything
        run: |
          if ! git diff --exit-code; then
            echo
            echo "Generated code is out of date. Run 'go generate ./...' and commit the result."
            exit 1
          fi
